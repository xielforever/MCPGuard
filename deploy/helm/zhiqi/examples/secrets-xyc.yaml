# 在 Git 忽略的副本中填写，仅替换本次获准的执契凭据。
apiVersion: v1
kind: Secret
metadata:
  name: zhiqi-nacos
  namespace: zhiqi
type: Opaque
stringData:
  username: "REPLACE_NACOS_READER_USERNAME"
  password: "REPLACE_NACOS_READER_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: zhiqi-postgres-ca
  namespace: zhiqi
type: Opaque
stringData:
  ca.crt: |
    REPLACE_POSTGRES_CA_PEM
---
apiVersion: v1
kind: Secret
metadata:
  name: zhiqi-runtime
  namespace: zhiqi
type: Opaque
stringData:
  encryptionKey: "REPLACE_BASE64_32_BYTE_ENCRYPTION_KEY"
  planKey: "REPLACE_DIFFERENT_BASE64_32_BYTE_PLAN_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: zhiqi-console
  namespace: zhiqi
type: Opaque
stringData:
  console.json: |
    [
      {
        "Username": "REPLACE_ADMIN_LOGIN",
        "OrgID": "REPLACE_ORG_UUID",
        "PrincipalID": "REPLACE_ADMIN_PRINCIPAL_UUID",
        "PasswordHash": "REPLACE_ADMIN_PASSWORD_SHA256_HEX"
      },
      {
        "Username": "REPLACE_REVIEWER_LOGIN",
        "OrgID": "REPLACE_ORG_UUID",
        "PrincipalID": "REPLACE_REVIEWER_PRINCIPAL_UUID",
        "PasswordHash": "REPLACE_REVIEWER_PASSWORD_SHA256_HEX"
      }
    ]
---
apiVersion: v1
kind: Secret
metadata:
  name: zhiqi-migration
  namespace: zhiqi
type: Opaque
stringData:
  dsn: "postgresql://REPLACE_MIGRATION_USER:REPLACE_URL_ENCODED_PASSWORD@192.0.2.18:5432/REPLACE_ZHIQI_PG_DATABASE?sslmode=verify-ca&sslrootcert=/etc/zhiqi/postgres/ca.crt"
