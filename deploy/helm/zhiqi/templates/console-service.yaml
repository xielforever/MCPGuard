{{- if and (not .Values.migration.mode) .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-console
  labels:
    {{- include "zhiqi.consoleSelector" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "zhiqi.consoleSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.console.servicePort }}
      targetPort: http
      protocol: TCP
{{- end }}