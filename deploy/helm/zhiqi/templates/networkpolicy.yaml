{{- if and (not .Values.migration.mode) .Values.console.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gateway-ingress
  labels:
    {{- include "zhiqi.selector" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zhiqi.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "zhiqi.consoleSelector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.ingress.port }}
{{- end }}