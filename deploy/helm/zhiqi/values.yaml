image:
  repository: ""
  digest: ""
  pullSecrets: []

nacos:
  url: ""
  namespaceId: ""
  group: ""
  dataId: ""
  authSecret: ""

metadata:
  database: ""
  port: 5432
  caSecret: ""

runtimeSecret: ""
consoleSecret: ""
connectorAllowedCIDRs: ""

# Split console frontend. The gateway keeps its loopback listener; the
# frontend Deployment serves the embedded static console and proxies the
# gateway-owned login/API/MCP paths to a cluster-only Service.
console:
  enabled: true
  replicas: 1
  listen: 0.0.0.0:8080
  servicePort: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# The gateway Service targets the loopback-preserving ingress sidecar. A
# NetworkPolicy allows only the console frontend pods to reach it.
gateway:
  servicePort: 18082
  ingress:
    listen: 0.0.0.0:18080
    port: 18080
    target: 127.0.0.1:18082
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

# The connector intentionally refuses plain HTTP to a non-loopback Jenkins
# endpoint. The isolated CCE acceptance therefore exposes the cluster-internal
# Jenkins HTTP port only on the pod's loopback interface. The Jenkins App
# entered in the console uses http://127.0.0.1:18083; the proxy never has a
# Service and is not reachable outside the pod network namespace.
jenkinsProxy:
  enabled: true
  listen: 127.0.0.1:18083
  target: infra-jenkins.infra.svc.cluster.local:8080
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Set mode to plan or apply when rendering a standalone migration Job.
migration:
  mode: ""
  runId: ""
  dsnSecret: ""
